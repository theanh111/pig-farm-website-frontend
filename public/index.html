    <meta
        name="description"
        content="Giống lợn Móng Cái là giống lợn nội phổ biến ở Việt Nam. Có nguồn gốc ở vùng Hải Đông, Bắc Sơn, Hải Tiến, Quảng Nghĩa (Móng Cái), Đầm Hà, Hà Cối, Đông Triều, tỉnh Quảng Ninh. Giống này có tính ưu việt là mắn đẻ, tầm vóc lớn hơn lợn Ỉ, tăng trọng khá, số con đẻ ra/lứa nhiều, do đó đã làm cho lợn Móng Cái phát triển nhanh chóng ra khắp các tỉnh đồng bằng Sông Hồng, Trung Du và miền núi phía Bắc, miền Trung, Tây Nguyên và cả ở miền Nam. Hiện nay do chăn nuôi lợn nhập nội theo hướng trang trại ngày càng phát triển, nên số lượng lợn Móng Cái đang có xu hướng giảm."
